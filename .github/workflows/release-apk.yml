name: Release APK
on: { workflow_dispatch: {} }
permissions: { contents: write }
concurrency: { group: release-apk, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - id: version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION exists. Bump expo.version in app.json first."; exit 1
          fi
      - run: npx --yes eas-cli@latest build --platform android --profile production --non-interactive --wait --json > build.json
      - run: curl -fL "$(node -p "require('./build.json')[0].artifacts.buildUrl")" -o "PinVault-v${{ steps.version.outputs.version }}.apk"
      - run: |
          gh release create "v${{ steps.version.outputs.version }}" "PinVault-v${{ steps.version.outputs.version }}.apk" \
            --target "${{ github.sha }}" --title "PinVault v${{ steps.version.outputs.version }}" \
            --notes "Download the .apk on your Android phone and tap it to install."
